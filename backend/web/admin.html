<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignEye · Quản trị thanh toán</title><style>body{font:15px system-ui;background:#f8f3f6;color:#322532;margin:0}header{background:#92145a;color:white;padding:22px 5%}main{max-width:1100px;margin:30px auto;padding:0 18px}input,button{padding:11px;border:1px solid #decbd6;border-radius:9px}button{background:#92145a;color:white;cursor:pointer}input{min-width:250px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0}.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001}.num{font-size:26px;font-weight:750;color:#92145a}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}section{overflow:auto}small{color:#666}#error{color:#b42318}</style><header><h1>SignEye · Dashboard Admin</h1><div>Thống kê thanh toán SignEye Pro</div></header><main><label>Khóa quản trị <input id="key" type="password" autocomplete="off" placeholder="Nhập khóa quản trị"></label> <button id="load">Xem thống kê</button><p id="error" role="alert"></p><div id="content" hidden><div class="cards" id="cards"></div><h2>Đơn hàng gần đây</h2><section><table><thead><tr><th>Mã đơn</th><th>Email</th><th>Gói</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead><tbody id="orders"></tbody></table></section><p><small>Chỉ xác nhận khi đã đối chiếu sao kê ngân hàng. Không xác nhận dựa vào ảnh chuyển khoản.</small></p></div></main><script>const $=id=>document.getElementById(id);let key='';const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' ₫';const cell=(row,value)=>{let td=document.createElement('td');td.textContent=value;row.append(td);return td};async function load(){key=$('key').value;$('error').textContent='';try{let r=await fetch('/admin/payments',{headers:{'x-admin-key':key},cache:'no-store'});if(!r.ok)throw Error('Không có quyền truy cập hoặc máy chủ lỗi ('+r.status+')');let data=await r.json(),s=data.summary;let metrics=[['Người mua',s.buyers],['Giao dịch thành công',s.purchases],['Gói tháng',s.monthly],['Gói năm',s.yearly],['Doanh thu',money(s.revenue)]];$('cards').replaceChildren();for(let [label,value] of metrics){let box=document.createElement('div');box.className='card';let l=document.createElement('div');l.textContent=label;let n=document.createElement('div');n.className='num';n.textContent=value;box.append(l,n);$('cards').append(box)}$('orders').replaceChildren();for(let o of data.orders){let tr=document.createElement('tr');cell(tr,o.id);cell(tr,o.email);cell(tr,o.plan==='year'?'1 năm':'1 tháng');cell(tr,money(o.amount));cell(tr,o.status==='paid'?'Đã thanh toán':o.status==='submitted'?'Chờ duyệt':o.status==='pending'?'Chờ chuyển khoản':'Từ chối');cell(tr,new Date(o.created_at).toLocaleString('vi-VN'));let td=document.createElement('td');if(o.status==='submitted'){let b=document.createElement('button');b.textContent='Xác nhận';b.onclick=async()=>{if(!confirm('Bạn đã đối chiếu sao kê và xác nhận tiền đã về tài khoản?'))return;let r=await fetch('/admin/payments/'+encodeURIComponent(o.id)+'/confirm',{method:'POST',headers:{'x-admin-key':key}});if(r.ok)load();else $('error').textContent='Không thể xác nhận đơn'};td.append(b);let reject=document.createElement('button');reject.textContent='Từ chối';reject.style.marginLeft='6px';reject.onclick=async()=>{if(!confirm('Từ chối đơn hàng này?'))return;let r=await fetch('/admin/payments/'+encodeURIComponent(o.id)+'/reject',{method:'POST',headers:{'x-admin-key':key}});if(r.ok)load();else $('error').textContent='Không thể từ chối đơn'};td.append(reject)}tr.append(td);$('orders').append(tr)}$('content').hidden=false}catch(e){$('error').textContent=e.message;$('content').hidden=true}}$('load').onclick=load;</script></html>
