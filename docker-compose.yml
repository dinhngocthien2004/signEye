services:
  postgres:
    image: postgres:16-alpine
    container_name: signeye_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signeye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
