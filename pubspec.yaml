name: signeye_flutter
description: "SignEye - Tra cứu biển báo giao thông Việt Nam (Flutter port)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/signs.json
    - assets/data/exam.json
    - assets/data/learning.json
    - assets/data/handbook.json
    - assets/images/guide/
    - assets/images/mandatory/
    - assets/images/prohibition/
    - assets/images/supplementary/
    - assets/images/warning/
